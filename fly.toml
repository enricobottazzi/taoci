app = "taoci"
primary_region = "fra"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[mounts]]
  source = "taoci_data"
  destination = "/app/np-l20-res-16k"

[[vm]]
  cpu_kind = "shared"
  cpus = 2  
  memory_mb = 4096
