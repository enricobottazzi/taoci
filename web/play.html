<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Atlas Of Concept Islands</title>
<style>
  :root { --c: #fff; --cr: 255,255,255; }
  body.win  { --c: #5f5; --cr: 85,255,85; }
  body.lose { --c: #f55; --cr: 255,85,85; }
  html, body { margin: 0; min-height: 100%; background: #000; color: var(--c);
               font-family: ui-monospace, Menlo, monospace;
               transition: color 200ms ease; }
  #wrap { max-width: 880px; margin: 0 auto; padding: 24px;
          display: flex; flex-direction: column; gap: 16px; }
  #bar { display: flex; align-items: center; gap: 12px; }
  #bar a { color: var(--c); text-decoration: none; border: 1px solid var(--c);
           padding: 6px 12px; letter-spacing: 2px; font-size: 12px; }
  #bar a:hover { background: var(--c); color: #000; }
  h1 { margin: 0; font-size: 14px; font-weight: normal; letter-spacing: 4px; }
  #card { border: 1px solid var(--c); padding: 16px 18px; font-size: 13px;
          transition: border-color 200ms ease; }
  dl { margin: 0; display: grid; grid-template-columns: 10ch 1fr;
       row-gap: 6px; column-gap: 12px; }
  dt { opacity: 0.5; }
  dd { margin: 0; }
  h2 { margin: 0 0 12px; font-size: 12px; font-weight: normal; letter-spacing: 2px; }
  .desc { opacity: 0.5; font-size: 11px; margin: 0 0 10px; letter-spacing: 1px; }
  .count { opacity: 0.5; font-size: 11px; letter-spacing: 1px; }
  #submitRow { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #examples { display: flex; flex-direction: column; gap: 10px; }
  .ex { border: 1px solid rgba(var(--cr),0.25); padding: 8px 10px;
        font-size: 13px; line-height: 1.7; white-space: pre-wrap;
        word-break: break-word; }
  .tk { padding: 0 1px; }
  .empty { opacity: 0.5; }
  textarea { width: 100%; box-sizing: border-box; background: #000; color: var(--c);
             border: 1px solid rgba(var(--cr),0.25); font: inherit;
             padding: 8px; outline: none; min-height: 64px; resize: vertical; }
  textarea::placeholder { color: rgba(var(--cr),0.4); }
  textarea:focus { background: var(--c); color: #000; }
  textarea:focus::placeholder { color: rgba(0,0,0,0.4); }
  button { background: #000; color: var(--c); border: 1px solid var(--c); font: inherit;
           padding: 8px 18px; letter-spacing: 4px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--c); color: #000; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #submitBox { font-size: 13px; display: inline-flex; align-items: center; gap: 10px; }
  #submitBox .hint { opacity: 0.5; font-size: 11px; letter-spacing: 1px; }
  #submitBox .score { font-size: 20px; letter-spacing: 4px; }
  #submitBox.err { color: #f66; }
  .spin { display: inline-block; width: 1ch; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <a href="map.html">BACK</a>
  </div>
  <div id="card">
    <h2>== FEATURE ==</h2>
    <dl>
      <dt>ID</dt><dd id="p-id">—</dd>
      <dt>LABEL</dt><dd id="p-label">—</dd>
      <dt>FOUND BY</dt><dd id="p-disc">—</dd>
      <dt>FOUND AT</dt><dd id="p-date">—</dd>
      <dt>SCORE</dt><dd id="p-score">—</dd>
    </dl>
  </div>
  <div id="card">
    <h2>== YOUR SUGGESTED LABEL ==</h2>
    <textarea id="exp" maxlength="1000"
      placeholder="label the concept that the activation examples below seem to share in common"></textarea>
    <div id="submitRow">
      <button id="submit" type="button">SUBMIT</button>
      <span class="count"><span id="count">0</span>/1000</span>
      <span id="submitBox"></span>
    </div>
  </div>
  <div id="card">
    <h2>== ACTIVATION EXAMPLES ==</h2>
    <div id="examples" class="empty">loading…</div>
  </div>
</div>
<script>
const pId = document.getElementById("p-id");
const pLabel = document.getElementById("p-label");
const pDisc = document.getElementById("p-disc");
const pDate = document.getElementById("p-date");
const pScore = document.getElementById("p-score");
const exEl = document.getElementById("examples");

const tok = localStorage.getItem("taoci.token");
if (!tok) { location.href = "login.html"; }

let id = null;
(async () => {
  const r = await fetch("/play", { headers: { Authorization: "Bearer " + tok } });
  if (r.status === 401) { location.href = "login.html"; return; }
  const j = await r.json();
  id = j.id;
  pId.textContent = `#${id}`;
  const b = j.best;
  pLabel.textContent = b?.label ?? "—";
  pDisc.textContent = b?.user ?? "—";
  pDate.textContent = b?.found_at ?? "—";
  pScore.textContent = b && Number.isFinite(b.score) ? b.score.toFixed(3) : "—";

  const exs = j.top_activations ?? [];
  if (exs.length === 0) {
    exEl.textContent = "no activations available";
  } else {
    const mx = Math.max(...exs.map(e => e.max));
    exEl.classList.remove("empty");
    exEl.innerHTML = exs.map(e =>
      `<div class="ex">${e.tokens.map((t, i) => {
        const a = (e.values[i] / mx).toFixed(3);
        const txt = t.replace(/▁/g, " ").replace(/</g, "&lt;").replace(/\n/g, "↵");
        return `<span class="tk" style="background:rgba(255,165,0,${a})">${txt}</span>`;
      }).join("")}</div>`
    ).join("");
  }

  const expEl = document.getElementById("exp");
  const box = document.getElementById("submitBox");
  const btn = document.getElementById("submit");
  const cnt = document.getElementById("count");
  expEl.addEventListener("input", () => { cnt.textContent = expEl.value.length; });
  btn.addEventListener("click", async () => {
    const description = expEl.value.trim();
    box.classList.remove("err");
    document.body.classList.remove("win", "lose");
    if (!description) {
      box.innerHTML = `<span class="hint">enter an explanation first.</span>`;
      return;
    }
    box.innerHTML = `<span class="spin">|</span>`
      + `<span class="hint">scoring… up to ~60s</span>`;
    const frames = ["|", "/", "-", "\\"];
    let f = 0;
    const spinEl = box.querySelector(".spin");
    const tick = setInterval(() => { spinEl.textContent = frames[++f % 4]; }, 120);
    try {
      const res = await fetch("/score", {
        method: "POST",
        headers: { "Content-Type": "application/json",
                   Authorization: "Bearer " + tok },
        body: JSON.stringify({ feature_id: id, description }),
      });
      const txt = await res.text();
      let j; try { j = JSON.parse(txt); }
      catch { throw new Error(`/score returned non-JSON (HTTP ${res.status})`); }
      if (!res.ok) throw new Error(j.detail || j.error || res.statusText);
      document.body.classList.add(j.is_new_best ? "win" : "lose");
      if (j.is_new_best) {
        const me = JSON.parse(localStorage.getItem("taoci.user") || "{}");
        pLabel.textContent = description;
        pDisc.textContent = me.username ?? "—";
        pDate.textContent = new Date().toISOString().slice(0, 10);
        pScore.textContent = j.score.toFixed(3);
      }
      box.innerHTML = `<span class="score">${j.score.toFixed(3)}</span>`
        + (j.is_new_best ? `<span class="hint">NEW BEST</span>` : "");
    } catch (e) {
      box.classList.add("err");
      box.innerHTML = `<span class="hint">error: ${e.message}</span>`;
    } finally {
      clearInterval(tick);
    }
  });
})();
</script>
</body>
</html>
