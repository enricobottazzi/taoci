<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>taoci — login</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
               font-family: ui-monospace, Menlo, monospace; }
  body { display: flex; align-items: center; justify-content: center; }
  form { display: grid; grid-template-columns: auto auto; gap: 8px 12px;
         justify-content: start; }
  label { align-self: center; opacity: 0.6; font-size: 11px; letter-spacing: 1px; }
  input { background: #000; color: #fff; border: 1px solid #fff;
          font: inherit; padding: 4px 6px; outline: none; width: 24ch; }
  input:focus { background: #fff; color: #000; }
  a.btn { grid-column: 1 / -1; margin-top: 6px; background: #000; color: #fff;
          border: 1px solid #fff; padding: 6px; letter-spacing: 4px;
          text-align: center; text-decoration: none; cursor: pointer; }
  a.btn:hover { background: #fff; color: #000; }
  p.hint { grid-column: 1 / -1; margin: 0 0 4px; font-size: 11px;
           opacity: 0.5; }
</style>
</head>
<body>
  <form id="f" autocomplete="off">
    <p class="hint">new user? pick a fresh new username and password</p>
    <label for="u">USERNAME</label><input id="u" required minlength="2" maxlength="32" pattern="[A-Za-z0-9_\-]+" />
    <label for="p">PASSWORD</label><input id="p" type="password" required minlength="8" maxlength="256" />
    <button class="btn" type="submit">ENTER</button>
    <p id="err" class="hint" style="color:#f55;display:none"></p>
  </form>
<script>
  const f = document.getElementById("f");
  const err = document.getElementById("err");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.style.display = "none";
    const btn = f.querySelector("button");
    btn.disabled = true;
    try {
      const r = await fetch("/auth", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ username: u.value, password: p.value }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || j.message || `HTTP ${r.status}`);
      localStorage.setItem("taoci.token", j.access_token);
      localStorage.setItem("taoci.user", JSON.stringify(j.user));
      location.href = "map.html";
    } catch (ex) {
      err.textContent = String(ex.message || ex);
      err.style.display = "block";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
